<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Admin — HD-Gaming officiel</title>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#060a14; --bg-panel:#0d1526; --bg-panel-2:#111b30; --line:#1c2740;
    --text:#eaf0fb; --text-dim:#8b96b3; --blue:#2e8bff; --blue-bright:#5ec9ff; --cyan:#26e0ff;
    --green:#2ecc71; --red:#ff5c7a;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{ background:var(--bg); color:var(--text); font-family:'Inter',sans-serif; }
  h1,h2{ font-family:'Chakra Petch',sans-serif; }
  .wrap{ max-width:480px; margin:0 auto; padding:20px 18px 60px; }

  .lock-screen{ min-height:80vh; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:14px; }
  .lock-screen input{
    width:100%; max-width:280px; background:var(--bg-panel); border:1px solid var(--line);
    border-radius:12px; padding:13px 16px; color:var(--text); font-size:14px; text-align:center;
  }
  .lock-screen button{
    padding:12px 24px; border-radius:12px; border:none; font-weight:700;
    background:linear-gradient(90deg, var(--blue), var(--cyan)); color:#04101f;
  }
  .lock-error{ color:var(--red); font-size:12.5px; }

  h1.page-title{ font-size:19px; margin-bottom:4px; }
  p.page-sub{ font-size:12.5px; color:var(--text-dim); margin-bottom:20px; }

  .card{ background:var(--bg-panel); border:1px solid var(--line); border-radius:16px; padding:16px; margin-bottom:16px; }
  .card h2{ font-size:14px; margin-bottom:10px; color:var(--blue-bright); }

  textarea#pasteBox{
    width:100%; min-height:130px; background:var(--bg-panel-2); border:1px solid var(--line);
    border-radius:10px; padding:12px; color:var(--text); font-size:12.5px; font-family:monospace;
    resize:vertical; margin-bottom:10px;
  }
  .btn{
    display:inline-block; padding:11px 16px; border-radius:10px; border:none; font-weight:700; font-size:13px; cursor:pointer;
  }
  .btn-primary{ background:linear-gradient(90deg, var(--blue), var(--cyan)); color:#04101f; width:100%; }
  .btn-secondary{ background:var(--bg-panel-2); color:var(--text); border:1px solid var(--line); width:100%; }
  .btn-mini{ background:var(--bg-panel-2); color:var(--blue-bright); border:1px solid var(--line); font-size:12px; padding:7px 12px; }

  label{ display:block; font-size:11.5px; color:var(--text-dim); margin:10px 0 5px; }
  input[type=text], textarea, select{
    width:100%; background:var(--bg-panel-2); border:1px solid var(--line); border-radius:10px;
    padding:10px 12px; color:var(--text); font-size:13px; font-family:'Inter';
  }
  textarea{ resize:vertical; min-height:60px; }

  .links-repeater .link-row{ display:flex; gap:8px; margin-bottom:8px; }
  .links-repeater input{ flex:1; }
  .remove-link{ background:var(--bg-panel-2); border:1px solid var(--line); color:var(--red); border-radius:8px; width:36px; flex-shrink:0; }

  .toggle-row{ display:flex; align-items:center; justify-content:space-between; margin-top:14px; }
  .toggle-row label{ margin:0; color:var(--text); font-size:13px; }

  #statusMsg{ font-size:12.5px; padding:10px; border-radius:10px; margin-top:12px; display:none; }
  #statusMsg.ok{ display:block; background:rgba(46,204,113,0.12); border:1px solid rgba(46,204,113,0.4); color:var(--green); }
  #statusMsg.err{ display:block; background:rgba(255,92,122,0.12); border:1px solid rgba(255,92,122,0.4); color:var(--red); }

  .logout{ text-align:center; margin-top:20px; }
  .logout a{ color:var(--text-dim); font-size:12px; text-decoration:underline; }
</style>
</head>
<body>

<div id="lockScreen" class="lock-screen">
  <h1 class="page-title">Accès administrateur</h1>
  <p class="page-sub">Réservé à HD-Gaming officiel</p>
  <input type="password" id="passInput" placeholder="Mot de passe" onkeydown="if(event.key==='Enter') tryUnlock()">
  <button class="btn" onclick="tryUnlock()">Entrer</button>
  <p class="lock-error" id="lockError"></p>
</div>

<div class="wrap" id="adminPanel" style="display:none;">
  <h1 class="page-title">Publier un jeu</h1>
  <p class="page-sub">Colle le texte généré par le prompt, ou remplis à la main.</p>

  <div class="card">
    <h2>Remplissage automatique</h2>
    <textarea id="pasteBox" placeholder="Colle ici tout le bloc généré par le prompt (title: ... slug: ... etc.)"></textarea>
    <button class="btn btn-secondary" onclick="autoFill()">Remplir les champs automatiquement</button>
  </div>

  <div class="card">
    <h2>Détails du jeu</h2>
    <label>Titre</label>
    <input type="text" id="f_title">
    <label>Slug (identifiant unique, sans espace)</label>
    <input type="text" id="f_slug">
    <label>Description</label>
    <textarea id="f_description"></textarea>
    <label>Catégorie</label>
    <select id="f_category">
      <option>Action</option><option>RPG</option><option>Sport</option>
      <option>Mod APK</option><option>ROMs / ISO</option>
    </select>
    <label>Plateforme</label>
    <input type="text" id="f_platform" placeholder="Android / PSP / PPSSPP...">
    <label>Taille du fichier</label>
    <input type="text" id="f_file_size" placeholder="480 Mo">
    <label>Config minimum</label>
    <input type="text" id="f_min_requirements" placeholder="Android 8+, 2 Go RAM">
  </div>

  <div class="card">
    <h2>Images</h2>
    <label>Miniature (thumbnail)</label>
    <input type="text" id="f_thumbnail_url" placeholder="https://...">
    <label>Captures d'écran (séparées par des virgules)</label>
    <textarea id="f_screenshots_urls" placeholder="https://img1.jpg, https://img2.jpg"></textarea>
  </div>

  <div class="card">
    <h2>Téléchargement</h2>
    <label>Lien principal</label>
    <input type="text" id="f_download_url" placeholder="https://mediafire.com/...">

    <div class="toggle-row">
      <label>Ce jeu a plusieurs liens (jeu + texture + save...)</label>
      <input type="checkbox" id="multiToggle" onchange="toggleMulti()">
    </div>
    <div id="linksRepeater" class="links-repeater" style="display:none; margin-top:10px;">
      <div id="linkRows"></div>
      <button type="button" class="btn btn-mini" onclick="addLinkRow()">+ Ajouter un lien</button>
    </div>
  </div>

  <button class="btn btn-primary" onclick="submitGame()">Publier le jeu</button>
  <div id="statusMsg"></div>

  <div class="logout"><a href="#" onclick="logout()">Se déconnecter</a></div>
</div>

<script>
  const SUPABASE_URL = "https://aouuisrouenmqvzssbpp.supabase.co";
  const SUPABASE_KEY = "sb_publishable_nQ2k-gbKPLyZ_2Qw2AbqAA_9Y-PM9xC";

  // ===== Verrouillage =====
  async function tryUnlock(){
    const pass = document.getElementById('passInput').value.trim();
    const errEl = document.getElementById('lockError');
    errEl.textContent = '';
    if(!pass){ return; }
    try{
      const res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/verify_admin_secret`, {
        method: 'POST',
        headers: {
          "apikey": SUPABASE_KEY, "Authorization": `Bearer ${SUPABASE_KEY}`,
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ p_secret: pass })
      });
      const ok = await res.json();
      if(ok === true){
        sessionStorage.setItem('hdg_admin_pass', pass);
        checkAccess();
      } else {
        errEl.textContent = "Mot de passe incorrect.";
      }
    }catch(e){
      errEl.textContent = "Erreur de connexion.";
    }
  }
  function logout(){
    sessionStorage.removeItem('hdg_admin_pass');
    location.reload();
  }
  function checkAccess(){
    const pass = sessionStorage.getItem('hdg_admin_pass');
    if(pass){
      document.getElementById('lockScreen').style.display = 'none';
      document.getElementById('adminPanel').style.display = 'block';
    }
  }
  // Ne pas se fier à sessionStorage seul au chargement — revérifier si présent
  (async function initAccess(){
    const pass = sessionStorage.getItem('hdg_admin_pass');
    if(!pass) return;
    try{
      const res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/verify_admin_secret`, {
        method: 'POST',
        headers: {
          "apikey": SUPABASE_KEY, "Authorization": `Bearer ${SUPABASE_KEY}`,
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ p_secret: pass })
      });
      const ok = await res.json();
      if(ok === true) checkAccess();
      else sessionStorage.removeItem('hdg_admin_pass');
    }catch(e){}
  })();

  // ===== Auto-remplissage depuis le texte collé =====
  function autoFill(){
    const raw = document.getElementById('pasteBox').value;
    const lines = raw.split('\n');
    const map = {};
    lines.forEach(line => {
      const m = line.match(/^([a-z_]+)\s*:\s*(.*)$/i);
      if(m) map[m[1].toLowerCase()] = m[2].trim();
    });
    if(map.title) document.getElementById('f_title').value = map.title;
    if(map.slug) document.getElementById('f_slug').value = map.slug;
    if(map.description) document.getElementById('f_description').value = map.description;
    if(map.category) document.getElementById('f_category').value = map.category;
    if(map.platform) document.getElementById('f_platform').value = map.platform;
    if(map.file_size) document.getElementById('f_file_size').value = map.file_size;
    if(map.min_requirements) document.getElementById('f_min_requirements').value = map.min_requirements;
    if(map.download_url) document.getElementById('f_download_url').value = map.download_url;
    if(map.thumbnail_url) document.getElementById('f_thumbnail_url').value = map.thumbnail_url;
    if(map.screenshots_urls) document.getElementById('f_screenshots_urls').value = map.screenshots_urls;
  }

  // ===== Liens multiples =====
  function toggleMulti(){
    const on = document.getElementById('multiToggle').checked;
    document.getElementById('linksRepeater').style.display = on ? 'block' : 'none';
    if(on && !document.getElementById('linkRows').children.length){
      addLinkRow(); addLinkRow();
    }
  }
  function addLinkRow(){
    const row = document.createElement('div');
    row.className = 'link-row';
    row.innerHTML = `
      <input type="text" placeholder="Label (ex: Jeu)" class="link-label">
      <input type="text" placeholder="URL" class="link-url">
      <button type="button" class="remove-link" onclick="this.parentElement.remove()">✕</button>
    `;
    document.getElementById('linkRows').appendChild(row);
  }

  // ===== Envoi =====
  async function submitGame(){
    const status = document.getElementById('statusMsg');
    const data = {
      title: document.getElementById('f_title').value.trim(),
      slug: document.getElementById('f_slug').value.trim(),
      description: document.getElementById('f_description').value.trim(),
      category: document.getElementById('f_category').value,
      platform: document.getElementById('f_platform').value.trim(),
      file_size: document.getElementById('f_file_size').value.trim(),
      min_requirements: document.getElementById('f_min_requirements').value.trim(),
      download_url: document.getElementById('f_download_url').value.trim(),
      thumbnail_url: document.getElementById('f_thumbnail_url').value.trim(),
      screenshots_urls: document.getElementById('f_screenshots_urls').value.trim()
    };
    if(!data.title || !data.slug){
      status.className = 'err'; status.textContent = "Titre et slug obligatoires."; return;
    }
    if(document.getElementById('multiToggle').checked){
      const links = [];
      document.querySelectorAll('.link-row').forEach(row => {
        const label = row.querySelector('.link-label').value.trim();
        const url = row.querySelector('.link-url').value.trim();
        if(label && url) links.push({label, url});
      });
      if(links.length) data.extra_links = links;
    }

    const pass = sessionStorage.getItem('hdg_admin_pass');
    status.className = ''; status.style.display = 'none';
    try{
      const res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/admin_add_game`, {
        method: 'POST',
        headers: {
          "apikey": SUPABASE_KEY, "Authorization": `Bearer ${SUPABASE_KEY}`,
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ p_secret: pass, p_data: data })
      });
      if(!res.ok){
        const err = await res.text();
        if(err.includes('Accès refusé')){
          status.className = 'err'; status.textContent = "Mot de passe incorrect. Reconnecte-toi.";
          sessionStorage.removeItem('hdg_admin_pass');
        } else {
          status.className = 'err'; status.textContent = "Erreur : " + err.slice(0,150);
        }
        return;
      }
      status.className = 'ok'; status.textContent = "✓ Jeu publié avec succès !";
      document.getElementById('pasteBox').value = '';
      ['f_title','f_slug','f_description','f_platform','f_file_size','f_min_requirements','f_download_url','f_thumbnail_url','f_screenshots_urls']
        .forEach(id => document.getElementById(id).value = '');
      document.getElementById('linkRows').innerHTML = '';
      document.getElementById('multiToggle').checked = false;
      document.getElementById('linksRepeater').style.display = 'none';
    }catch(e){
      status.className = 'err'; status.textContent = "Erreur de connexion.";
    }
  }
</script>
</body>
</html>
