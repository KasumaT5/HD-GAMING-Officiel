<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mes favoris — HD-Gaming officiel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#060a14; --bg-panel:#0d1526; --line:#1c2740;
    --text:#eaf0fb; --text-dim:#8b96b3; --blue-bright:#5ec9ff;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{ background:var(--bg); color:var(--text); font-family:'Inter',sans-serif; -webkit-font-smoothing:antialiased; }
  h1,.brand{ font-family:'Chakra Petch',sans-serif; }
  a{ color:inherit; text-decoration:none; }
  .wrap{ max-width:480px; margin:0 auto; }

  header{
    display:flex; align-items:center; gap:12px; padding:16px 18px;
    border-bottom:1px solid var(--line); position:sticky; top:0;
    background:rgba(6,10,20,0.9); backdrop-filter:blur(10px); z-index:20;
  }
  .back-btn{
    width:36px; height:36px; border-radius:10px; background:var(--bg-panel); border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .back-btn svg{ width:18px; height:18px; }
  header .brand{ font-weight:700; font-size:15px; }
  header .brand span{ color:var(--blue-bright); }

  h1.title{ font-size:19px; font-weight:700; padding:18px 18px 4px; }

  .game-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; padding:8px 18px 24px; }
  .game-card{
    background:var(--bg-panel); border:1px solid var(--line); border-radius:16px; overflow:hidden; display:block; color:inherit;
  }
  .thumb{ aspect-ratio:1/1; background:#0a1220; position:relative; display:flex; align-items:center; justify-content:center; }
  .thumb img{ width:100%; height:100%; object-fit:cover; }
  .badge{
    position:absolute; top:8px; left:8px; background:rgba(6,10,20,0.85);
    border:1px solid rgba(94,201,255,0.35); color:var(--blue-bright);
    font-size:10px; font-weight:700; padding:3px 7px; border-radius:6px;
  }
  .game-info{ padding:10px 11px 12px; }
  .game-title{ font-size:13.5px; font-weight:600; margin-bottom:3px; line-height:1.3; }
  .game-meta{ font-size:11px; color:var(--text-dim); }

  .empty{ text-align:center; color:var(--text-dim); font-size:13.5px; padding:60px 24px; line-height:1.6; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a class="back-btn" href="index.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
    </a>
    <div class="brand">HD-GAMING <span>officiel</span></div>
  </header>

  <h1 class="title">Mes favoris</h1>
  <div class="game-grid" id="gameGrid">
    <p style="grid-column:1/-1; text-align:center; color:var(--text-dim); font-size:13px; padding:20px 0;">Chargement...</p>
  </div>
</div>

<script>
  const SUPABASE_URL = "https://aouuisrouenmqvzssbpp.supabase.co";
  const SUPABASE_KEY = "sb_publishable_nQ2k-gbKPLyZ_2Qw2AbqAA_9Y-PM9xC";

  function getFavs(){
    try{ return JSON.parse(localStorage.getItem('hdg_favs') || '[]'); }catch(e){ return []; }
  }

  async function loadFavs(){
    const grid = document.getElementById('gameGrid');
    const favs = getFavs();
    if(!favs.length){
      grid.innerHTML = `<div class="empty" style="grid-column:1/-1;">Tu n'as encore aucun favori.<br>Appuie sur le cœur d'un jeu pour le retrouver ici.</div>`;
      return;
    }
    try{
      const orFilter = favs.map(s => `slug.eq.${encodeURIComponent(s)}`).join(',');
      const res = await fetch(`${SUPABASE_URL}/rest/v1/Games?select=*&or=(${orFilter})`, {
        headers: { "apikey": SUPABASE_KEY, "Authorization": `Bearer ${SUPABASE_KEY}` }
      });
      const games = await res.json();
      if(!games.length){
        grid.innerHTML = `<div class="empty" style="grid-column:1/-1;">Aucun de tes favoris n'est disponible pour le moment.</div>`;
        return;
      }
      grid.innerHTML = games.map(g => `
        <a class="game-card" href="jeu.html?slug=${encodeURIComponent(g.slug || '')}">
          <div class="thumb">
            ${g.category ? `<span class="badge">${g.category}</span>` : ''}
            ${g.thumbnail_url ? `<img src="${g.thumbnail_url}" alt="${g.title || ''}">` : ''}
          </div>
          <div class="game-info">
            <div class="game-title">${g.title || 'Sans titre'}</div>
            <div class="game-meta">${g.platform || ''}${g.platform && g.file_size ? ' · ' : ''}${g.file_size || ''}</div>
          </div>
        </a>
      `).join('');
    }catch(err){
      grid.innerHTML = `<div class="empty" style="grid-column:1/-1;">Erreur de chargement.</div>`;
    }
  }
  loadFavs();
</script>
</body>
</html>
