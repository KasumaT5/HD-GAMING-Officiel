<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fiche jeu — HD-Gaming officiel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#060a14; --bg-panel:#0d1526; --bg-panel-2:#111b30; --line:#1c2740;
    --text:#eaf0fb; --text-dim:#8b96b3; --blue:#2e8bff; --blue-bright:#5ec9ff; --cyan:#26e0ff; --gold:#f4c95d;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{ background:var(--bg); color:var(--text); font-family:'Inter',sans-serif; -webkit-font-smoothing:antialiased; }
  h1,h2,h3,.brand{ font-family:'Chakra Petch',sans-serif; }
  a{ color:inherit; text-decoration:none; }
  .wrap{ max-width:480px; margin:0 auto; }

  header{
    display:flex; align-items:center; gap:12px;
    padding:16px 18px; border-bottom:1px solid var(--line);
    position:sticky; top:0; background:rgba(6,10,20,0.9); backdrop-filter:blur(10px); z-index:20;
  }
  .back-btn{
    width:36px; height:36px; border-radius:10px;
    background:var(--bg-panel); border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
    color:var(--text);
  }
  .back-btn svg{ width:18px; height:18px; display:block; }
  header .brand{ font-weight:700; font-size:15px; }
  header .brand span{ color:var(--blue-bright); }

  .gallery{ display:flex; gap:8px; overflow-x:auto; padding:14px 18px; scrollbar-width:none; }
  .gallery::-webkit-scrollbar{ display:none; }
  .gallery img{
    width:78%; flex-shrink:0; border-radius:14px; aspect-ratio:9/16; object-fit:cover;
    border:1px solid var(--line); background:var(--bg-panel);
  }
  .gallery-empty{
    width:100%; aspect-ratio:16/9; border-radius:14px; background:var(--bg-panel);
    border:1px solid var(--line); display:flex; align-items:center; justify-content:center; color:var(--line);
  }

  .content{ padding:6px 18px 24px; }
  .badge-row{ display:flex; gap:8px; margin-bottom:10px; flex-wrap:wrap; }
  .tag{
    font-size:11px; font-weight:600; padding:5px 10px; border-radius:8px;
    background:rgba(94,201,255,0.1); border:1px solid rgba(94,201,255,0.3); color:var(--blue-bright);
  }
  h1.title{ font-size:21px; font-weight:700; line-height:1.3; margin-bottom:10px; }
  .desc{ font-size:14px; line-height:1.7; color:#c7d0e6; margin-bottom:22px; }

  .info-box{
    background:var(--bg-panel); border:1px solid var(--line); border-radius:14px;
    padding:16px; margin-bottom:20px;
  }
  .info-box h3{ font-size:13px; font-weight:600; margin-bottom:10px; color:var(--blue-bright); }
  .info-row{ display:flex; justify-content:space-between; font-size:13px; padding:6px 0; border-bottom:1px solid var(--line); color:var(--text-dim); }
  .info-row:last-child{ border-bottom:none; }
  .info-row b{ color:var(--text); font-weight:500; }

  .dl-btn{
    display:block; width:100%; text-align:center;
    background:linear-gradient(90deg, var(--blue), var(--cyan));
    color:#04101f; font-weight:700; font-size:15px;
    padding:16px; border-radius:14px; margin-top:6px;
  }

  .reaction-row{ display:flex; gap:10px; margin-bottom:16px; }
  .reaction-btn{
    flex:1; display:flex; align-items:center; justify-content:center; gap:7px;
    padding:11px; border-radius:12px; background:var(--bg-panel); border:1px solid var(--line);
    font-size:13px; font-weight:600; color:var(--text-dim);
  }
  .reaction-btn svg{ width:16px; height:16px; }
  .reaction-btn.done{ color:var(--blue-bright); border-color:rgba(94,201,255,0.4); }
  .dl-count{ text-align:center; font-size:11.5px; color:var(--text-dim); margin-top:10px; }

  footer{ text-align:center; padding:26px 18px 34px; color:var(--text-dim); font-size:11.5px; border-top:1px solid var(--line); }

  .comments-section{ margin-top:26px; }
  .comments-section h3{ font-size:14px; font-weight:600; margin-bottom:12px; }
  .comment-form{
    background:var(--bg-panel); border:1px solid var(--line); border-radius:14px;
    padding:14px; margin-bottom:16px;
  }
  .comment-form input, .comment-form textarea{
    width:100%; background:var(--bg-panel-2); border:1px solid var(--line); border-radius:10px;
    padding:10px 12px; color:var(--text); font-family:'Inter'; font-size:13px; margin-bottom:10px;
    outline:none;
  }
  .comment-form textarea{ resize:vertical; min-height:60px; }
  .comment-form input:focus, .comment-form textarea:focus{ border-color:rgba(94,201,255,0.5); }
  .comment-submit{
    width:100%; padding:11px; border-radius:10px; border:none;
    background:linear-gradient(90deg, var(--blue), var(--cyan));
    color:#04101f; font-weight:700; font-size:13.5px;
  }
  .comment-item{
    padding:12px 0; border-bottom:1px solid var(--line);
  }
  .comment-item:last-child{ border-bottom:none; }
  .comment-author{ font-size:13px; font-weight:600; margin-bottom:3px; }
  .comment-date{ font-size:10.5px; color:var(--text-dim); font-weight:400; margin-left:6px; }
  .comment-msg{ font-size:13px; color:#c7d0e6; line-height:1.5; }
  .comments-empty{ font-size:12.5px; color:var(--text-dim); padding:10px 0; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a class="back-btn" href="index.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
    </a>
    <div class="brand">HD-GAMING <span>officiel</span></div>
  </header>

  <div id="pageContent">
    <p style="text-align:center; color:var(--text-dim); font-size:13px; padding:40px 18px;">Chargement...</p>
  </div>

  <footer>HD-GAMING officiel — Tous droits réservés</footer>
</div>

<script>
  const SUPABASE_URL = "https://aouuisrouenmqvzssbpp.supabase.co";
  const SUPABASE_KEY = "sb_publishable_nQ2k-gbKPLyZ_2Qw2AbqAA_9Y-PM9xC";

  const params = new URLSearchParams(window.location.search);
  const slug = params.get('slug');

  async function loadGame(){
    const content = document.getElementById('pageContent');
    if(!slug){
      content.innerHTML = `<p style="text-align:center; color:var(--text-dim); padding:40px 18px;">Jeu introuvable.</p>`;
      return;
    }
    try{
      const res = await fetch(`${SUPABASE_URL}/rest/v1/Games?select=*&slug=eq.${encodeURIComponent(slug)}`, {
        headers: { "apikey": SUPABASE_KEY, "Authorization": `Bearer ${SUPABASE_KEY}` }
      });
      const rows = await res.json();
      const g = rows[0];
      if(!g){
        content.innerHTML = `<p style="text-align:center; color:var(--text-dim); padding:40px 18px;">Ce jeu n'existe pas ou plus.</p>`;
        return;
      }
      document.title = `${g.title || 'Jeu'} — HD-Gaming officiel`;

      const images = (g.screenshots_urls || g.thumbnail_url || "")
        .toString().split(",").map(s => s.trim()).filter(Boolean);

      content.innerHTML = `
        <div class="gallery">
          ${images.length
            ? images.map(src => `<img src="${src}" alt="${g.title || ''}">`).join('')
            : `<div class="gallery-empty">Pas d'aperçu</div>`
          }
        </div>
        <div class="content">
          <div class="badge-row">
            ${g.category ? `<span class="tag">${g.category}</span>` : ''}
            ${g.platform ? `<span class="tag">${g.platform}</span>` : ''}
          </div>
          <h1 class="title">${g.title || 'Sans titre'}</h1>
          <p class="desc">${g.description || 'Aucune description pour le moment.'}</p>

          <div class="info-box">
            <h3>Informations</h3>
            <div class="info-row"><span>Taille</span><b>${g.file_size || 'Non indiqué'}</b></div>
            <div class="info-row"><span>Plateforme</span><b>${g.platform || 'Non indiqué'}</b></div>
            <div class="info-row"><span>Config. minimum</span><b>${g.min_requirements || 'Non indiqué'}</b></div>
          </div>

          <div class="reaction-row">
            <button class="reaction-btn" id="likeBtn">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 9V5a3 3 0 00-3-3l-4 9v11h11.3a2 2 0 002-1.7l1.4-9a2 2 0 00-2-2.3H14z"/></svg>
              <span id="likeCount">0</span>
            </button>
            <button class="reaction-btn" id="dislikeBtn">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 15v4a3 3 0 003 3l4-9V2H5.7a2 2 0 00-2 1.7l-1.4 9a2 2 0 002 2.3H10z"/></svg>
              <span id="dislikeCount">0</span>
            </button>
          </div>

          <a class="dl-btn" href="telecharger.html?slug=${encodeURIComponent(g.slug || '')}">Télécharger</a>
          <div class="dl-count"><span id="dlCount">${g.downloads || 0}</span> téléchargements</div>

          <div class="comments-section">
            <h3>Commentaires</h3>
            <div class="comment-form">
              <input type="text" id="commentAuthor" placeholder="Ton pseudo" maxlength="30">
              <textarea id="commentMsg" placeholder="Ton avis sur ce jeu..." maxlength="300"></textarea>
              <button class="comment-submit" id="commentSubmit">Publier</button>
            </div>
            <div id="commentsList">
              <p class="comments-empty">Chargement des commentaires...</p>
            </div>
          </div>
        </div>
      `;
      document.getElementById('likeCount').textContent = g.likes || 0;
      document.getElementById('dislikeCount').textContent = g.dislikes || 0;
      setupReactions(g);
      loadComments();
    }catch(err){
      content.innerHTML = `<p style="text-align:center; color:var(--text-dim); padding:40px 18px;">Erreur de chargement.</p>`;
    }
  }

  function getReaction(slug){
    try{ return JSON.parse(localStorage.getItem('hdg_reactions') || '{}')[slug]; }catch(e){ return null; }
  }
  function setReaction(slug, value){
    let r = {};
    try{ r = JSON.parse(localStorage.getItem('hdg_reactions') || '{}'); }catch(e){}
    r[slug] = value;
    localStorage.setItem('hdg_reactions', JSON.stringify(r));
  }

  async function bump(field, delta, currentVal){
    try{
      await fetch(`${SUPABASE_URL}/rest/v1/Games?slug=eq.${encodeURIComponent(slug)}`, {
        method: 'PATCH',
        headers: {
          "apikey": SUPABASE_KEY, "Authorization": `Bearer ${SUPABASE_KEY}`,
          "Content-Type": "application/json", "Prefer": "return=minimal"
        },
        body: JSON.stringify({ [field]: currentVal + delta })
      });
    }catch(e){}
  }

  function setupReactions(g){
    const likeBtn = document.getElementById('likeBtn');
    const dislikeBtn = document.getElementById('dislikeBtn');
    let likes = g.likes || 0;
    let dislikes = g.dislikes || 0;
    const existing = getReaction(slug);
    if(existing === 'like') likeBtn.classList.add('done');
    if(existing === 'dislike') dislikeBtn.classList.add('done');

    likeBtn.addEventListener('click', () => {
      const current = getReaction(slug);
      if(current === 'like') return;
      likes++;
      if(current === 'dislike'){ dislikes--; bump('dislikes', -1, dislikes+1); dislikeBtn.classList.remove('done'); document.getElementById('dislikeCount').textContent = dislikes; }
      document.getElementById('likeCount').textContent = likes;
      likeBtn.classList.add('done');
      setReaction(slug, 'like');
      bump('likes', 1, likes-1);
    });

    dislikeBtn.addEventListener('click', () => {
      const current = getReaction(slug);
      if(current === 'dislike') return;
      dislikes++;
      if(current === 'like'){ likes--; bump('likes', -1, likes+1); likeBtn.classList.remove('done'); document.getElementById('likeCount').textContent = likes; }
      document.getElementById('dislikeCount').textContent = dislikes;
      dislikeBtn.classList.add('done');
      setReaction(slug, 'dislike');
      bump('dislikes', 1, dislikes-1);
    });
  }

  function escapeHtml(str){
    const d = document.createElement('div');
    d.textContent = str || '';
    return d.innerHTML;
  }

  function timeAgo(dateStr){
    const diff = Math.floor((Date.now() - new Date(dateStr).getTime()) / 1000);
    if(diff < 60) return "à l'instant";
    if(diff < 3600) return Math.floor(diff/60) + " min";
    if(diff < 86400) return Math.floor(diff/3600) + " h";
    return Math.floor(diff/86400) + " j";
  }

  async function loadComments(){
    const list = document.getElementById('commentsList');
    try{
      const res = await fetch(`${SUPABASE_URL}/rest/v1/comments?select=*&game_slug=eq.${encodeURIComponent(slug)}&order=created_at.desc`, {
        headers: { "apikey": SUPABASE_KEY, "Authorization": `Bearer ${SUPABASE_KEY}` }
      });
      const rows = await res.json();
      if(!rows.length){
        list.innerHTML = `<p class="comments-empty">Aucun commentaire pour l'instant. Sois le premier !</p>`;
        return;
      }
      list.innerHTML = rows.map(c => `
        <div class="comment-item">
          <div class="comment-author">${escapeHtml(c.author_name) || 'Anonyme'}<span class="comment-date">${timeAgo(c.created_at)}</span></div>
          <div class="comment-msg">${escapeHtml(c.message)}</div>
        </div>
      `).join('');
    }catch(e){
      list.innerHTML = `<p class="comments-empty">Impossible de charger les commentaires.</p>`;
    }
  }

  document.addEventListener('click', async (e) => {
    if(e.target.id !== 'commentSubmit') return;
    const author = document.getElementById('commentAuthor').value.trim();
    const msg = document.getElementById('commentMsg').value.trim();
    if(!msg){ return; }
    e.target.disabled = true;
    try{
      await fetch(`${SUPABASE_URL}/rest/v1/comments`, {
        method: 'POST',
        headers: {
          "apikey": SUPABASE_KEY, "Authorization": `Bearer ${SUPABASE_KEY}`,
          "Content-Type": "application/json", "Prefer": "return=minimal"
        },
        body: JSON.stringify({ game_slug: slug, author_name: author || 'Anonyme', message: msg })
      });
      document.getElementById('commentAuthor').value = '';
      document.getElementById('commentMsg').value = '';
      loadComments();
    }catch(e){}
    e.target.disabled = false;
  });

  loadGame();
</script>
