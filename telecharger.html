<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Téléchargement — HD-Gaming officiel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#060a14; --bg-panel:#0d1526; --bg-panel-2:#111b30; --line:#1c2740;
    --text:#eaf0fb; --text-dim:#8b96b3; --blue:#2e8bff; --blue-bright:#5ec9ff; --cyan:#26e0ff; --gold:#f4c95d;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{ background:var(--bg); color:var(--text); font-family:'Inter',sans-serif; -webkit-font-smoothing:antialiased; }
  h1,h2,.brand{ font-family:'Chakra Petch',sans-serif; }
  a{ color:inherit; text-decoration:none; }
  .wrap{ max-width:480px; margin:0 auto; padding:0 18px; }

  header{
    display:flex; align-items:center; gap:12px; padding:16px 0;
    border-bottom:1px solid var(--line);
  }
  .back-btn{
    width:36px; height:36px; border-radius:10px; background:var(--bg-panel); border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .back-btn svg{ width:18px; height:18px; }
  header .brand{ font-weight:700; font-size:15px; }
  header .brand span{ color:var(--blue-bright); }

  .dl-card{
    background:var(--bg-panel); border:1px solid var(--line); border-radius:18px;
    padding:26px 20px; text-align:center; margin:26px 0 18px;
  }
  .game-name{ font-size:16px; font-weight:600; margin-bottom:4px; }
  .game-sub{ font-size:12.5px; color:var(--text-dim); margin-bottom:22px; }

  .timer-ring{ width:96px; height:96px; margin:0 auto 18px; position:relative; }
  .timer-ring svg{ transform:rotate(-90deg); width:100%; height:100%; }
  .timer-ring circle{ fill:none; stroke-width:6; }
  .timer-ring .bg{ stroke:var(--line); }
  .timer-ring .fg{ stroke:url(#ringGrad); stroke-linecap:round; transition:stroke-dashoffset 1s linear; }
  .timer-num{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-size:26px; font-weight:700; font-family:'Chakra Petch',sans-serif;
  }

  .dl-btn{
    display:block; width:100%; text-align:center; padding:16px; border-radius:14px;
    font-weight:700; font-size:15px; font-family:'Chakra Petch',sans-serif;
    background:var(--bg-panel-2); color:var(--text-dim); border:1px solid var(--line);
    pointer-events:none; transition:all .3s;
  }
  .dl-btn.ready{
    background:linear-gradient(90deg, var(--blue), var(--cyan));
    color:#04101f; pointer-events:auto;
  }

  .partner-block{
    background:linear-gradient(135deg, var(--bg-panel), var(--bg-panel-2));
    border:1px solid rgba(94,201,255,0.25); border-radius:16px;
    padding:18px; margin-bottom:18px;
  }
  .partner-eyebrow{ font-size:10.5px; font-weight:700; letter-spacing:.5px; color:var(--blue-bright); margin-bottom:6px; text-transform:uppercase; }
  .partner-name{ font-size:15px; font-weight:700; margin-bottom:6px; }
  .partner-text{ font-size:12.5px; color:var(--text-dim); line-height:1.5; margin-bottom:12px; }
  .partner-code{
    display:inline-block; background:rgba(244,201,93,0.12); border:1px solid rgba(244,201,93,0.4);
    color:var(--gold); font-weight:700; font-size:14px; padding:6px 12px; border-radius:8px; margin-bottom:12px;
    letter-spacing:.5px;
  }
  .partner-btn{
    display:block; text-align:center; padding:11px; border-radius:10px;
    background:var(--blue); color:#fff; font-weight:600; font-size:13.5px;
  }

  footer{ text-align:center; padding:26px 0 34px; color:var(--text-dim); font-size:11.5px; border-top:1px solid var(--line); margin-top:10px; }

  .ad-slot{
    margin:0 0 18px; padding:10px;
    background:var(--bg-panel); border:1px solid var(--line); border-radius:14px;
    max-height:120px; overflow:hidden;
    display:flex; flex-direction:column; align-items:center;
  }
  .ad-slot .ad-label{
    font-size:9.5px; letter-spacing:.5px; text-transform:uppercase;
    color:var(--text-dim); margin-bottom:6px; align-self:flex-start;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a class="back-btn" id="backBtn" href="index.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
    </a>
    <div class="brand">HD-GAMING <span>officiel</span></div>
  </header>

  <div class="dl-card">
    <div class="game-name" id="gameName">Préparation du lien...</div>
    <div class="game-sub">Ton téléchargement démarre dans quelques secondes</div>

    <div class="timer-ring">
      <svg viewBox="0 0 100 100">
        <circle class="bg" cx="50" cy="50" r="44"></circle>
        <circle class="fg" id="ringFg" cx="50" cy="50" r="44" stroke-dasharray="276" stroke-dashoffset="0"></circle>
        <defs>
          <linearGradient id="ringGrad" x1="0" y1="0" x2="100" y2="100">
            <stop offset="0" stop-color="#2e8bff"/>
            <stop offset="1" stop-color="#26e0ff"/>
          </linearGradient>
        </defs>
      </svg>
      <div class="timer-num" id="timerNum">8</div>
    </div>

    <a class="dl-btn" id="dlBtn" href="#">Patiente...</a>
  </div>

  <div class="ad-slot">
    <span class="ad-label">Publicité</span>
    <script type="text/javascript">
      atOptions = {
        'key' : '5fec51d263b2e13ecde02ea8731809c0',
        'format' : 'iframe',
        'height' : 90,
        'width' : 728,
        'params' : {}
      };
    </script>
    <script src="https://www.highrevenueformat.com/5fec51d263b2e13ecde02ea8731809c0/invoke.js"></script>
  </div>

  <!-- Emplacement partenaire — bloc réutilisable, config centralisée dans window.PARTNER_CONFIG -->
  <div class="partner-block" id="partnerBlock" style="display:none;">
    <div class="partner-eyebrow">Partenaire gaming</div>
    <div class="partner-name" id="partnerName"></div>
    <div class="partner-text" id="partnerText"></div>
    <div class="partner-code" id="partnerCode"></div>
    <a class="partner-btn" id="partnerBtn" href="#" target="_blank">Utiliser mon code</a>
  </div>

  <footer>HD-GAMING officiel — Tous droits réservés</footer>
</div>

<script>
  // ===== Configuration centralisée des partenariats =====
  // Pour ajouter/modifier/retirer un partenaire, on ne touche qu'ici.
  const PARTNER_CONFIG = {
    enabled: true,
    name: "MMOEXP",
    promoCode: "HDGAMING",
    affiliateUrl: "https://www.mmoexp.com/sellers/735095",
    text: "Diamants Free Fire, Gold Blood Strike, pièces FC 27 et plus — au meilleur prix, en toute sécurité."
  };

  // ===== Récupération du jeu =====
  const SUPABASE_URL = "https://aouuisrouenmqvzssbpp.supabase.co";
  const SUPABASE_KEY = "sb_publishable_nQ2k-gbKPLyZ_2Qw2AbqAA_9Y-PM9xC";
  const params = new URLSearchParams(window.location.search);
  const slug = params.get('slug');
  document.getElementById('backBtn').href = slug ? `jeu.html?slug=${encodeURIComponent(slug)}` : 'index.html';

  async function loadGame(){
    if(!slug) return;
    try{
      const res = await fetch(`${SUPABASE_URL}/rest/v1/Games?select=title,download_url&slug=eq.${encodeURIComponent(slug)}`, {
        headers: { "apikey": SUPABASE_KEY, "Authorization": `Bearer ${SUPABASE_KEY}` }
      });
      const rows = await res.json();
      const g = rows[0];
      if(g){
        document.getElementById('gameName').textContent = g.title || 'Ton jeu';
        document.getElementById('dlBtn').dataset.target = g.download_url || '#';
      }
    }catch(e){}
  }
  loadGame();

  // ===== Compte à rebours =====
  let seconds = 8;
  const total = seconds;
  const ring = document.getElementById('ringFg');
  const circumference = 276;
  const numEl = document.getElementById('timerNum');
  const btn = document.getElementById('dlBtn');

  const interval = setInterval(() => {
    seconds--;
    numEl.textContent = seconds > 0 ? seconds : '✓';
    ring.style.strokeDashoffset = circumference * (seconds / total);
    if(seconds <= 0){
      clearInterval(interval);
      btn.textContent = "Télécharger maintenant";
      btn.classList.add('ready');
      btn.href = btn.dataset.target || '#';
      btn.target = "_blank";
    }
  }, 1000);

  // ===== Affichage du bloc partenaire =====
  if(PARTNER_CONFIG.enabled){
    document.getElementById('partnerBlock').style.display = 'block';
    document.getElementById('partnerName').textContent = PARTNER_CONFIG.name;
    document.getElementById('partnerText').textContent = PARTNER_CONFIG.text;
    document.getElementById('partnerCode').textContent = "Code : " + PARTNER_CONFIG.promoCode + " (-8%)";
    document.getElementById('partnerBtn').href = PARTNER_CONFIG.affiliateUrl;
  }
</script>  <!-- Adsterra — scripts site-wide -->

  <script src="https://pl31017076.profitableratecpmnetwork.com/27/ec/67/27ec670ff54cef08512c20f3959ed604.js"></script>

</body>
</html>
